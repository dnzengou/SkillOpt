[workspace]
members = ["gtm-engine", "security-agent", "shared", "evo-metaclaw"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "auth", "trace", "limit"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
governor = { version = "0.7", features = ["std"] }
governor_tower = { version = "0.7", package = "tower_governor" }
uuid = { version = "1.10", features = ["v4"] }
